services:
  api:
    build:
      context: .
      dockerfile: packages/vps-api/Dockerfile
    container_name: email-filter-api
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - email-filter-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/filter.db
      - API_TOKEN=${API_TOKEN}
      - DEFAULT_FORWARD_TO=${DEFAULT_FORWARD_TO}
      - VPS_PUBLIC_URL=${VPS_PUBLIC_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - CAMPAIGN_ANALYTICS_ENABLED=${CAMPAIGN_ANALYTICS_ENABLED:-true}
      - SIGNAL_MONITORING_ENABLED=${SIGNAL_MONITORING_ENABLED:-true}
      - SUBJECT_TRACKING_ENABLED=${SUBJECT_TRACKING_ENABLED:-true}
      - HEARTBEAT_CRON=${HEARTBEAT_CRON:-*/5 * * * *}
      - CLEANUP_CRON=${CLEANUP_CRON:-0 3 * * *}
      - HIT_LOG_RETENTION_HOURS=${HIT_LOG_RETENTION_HOURS:-72}
      - ALERT_RETENTION_DAYS=${ALERT_RETENTION_DAYS:-90}
      - RUN_HEARTBEAT_ON_START=${RUN_HEARTBEAT_ON_START:-false}
    restart: unless-stopped
    networks:
      - email-filter-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  email-filter-data:
    driver: local

networks:
  email-filter-network:
    driver: bridge
